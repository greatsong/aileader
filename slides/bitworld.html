<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 10/26 교사 워크샵 인트로(greatsong/workshop의 bit-world.html)를 가져온 것.
     ?embed=1 이면 발표 덱(slides/) 안에 끼워 덱의 단계 0~8로 넘긴다. 바꾼 곳: 표지 문구·마지막 문장(연수에 맞춤), 끼운 경우의 넘기기·자동 재생·멈춤 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아톰의 세상과 비트의 세상</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* 전체 화면 3D 무대. 왼쪽 위 해설, 오른쪽 아래 연도 카운터, 맨 아래 연대표. 키노트와 같은 색: 아톰=골드, 비트=시안 */
  :root{
    --bg:#0A0A0B;
    --ink:#F4F4F2;
    --dim:#A6A6A2;
    --faint:#5E5E60;
    --amber:#F3B03A;
    --cyan:#5AD6E6;
    --veil:rgba(10,10,11,.74);
    --veil0:rgba(10,10,11,0);
    --rule:rgba(244,244,242,.16);
    --chip:rgba(244,244,242,.06);
    --chip-h:rgba(244,244,242,.13);
    --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;}
  #stage:active{cursor:grabbing;}

  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 14px);
    transition:opacity .5s;}
  .hud.off{opacity:0;}
  .hud.off *{pointer-events:none !important;}
  .shade{position:fixed;left:0;top:0;width:min(760px,100%);height:400px;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,var(--veil) 0%,var(--veil0) 72%);}
  .shade.b{top:auto;bottom:0;left:0;width:100%;height:170px;background:linear-gradient(0deg,var(--veil) 0%,var(--veil0) 100%);}
  .top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .story{max-width:37rem;min-width:0;}
  .story.in > *{animation:rise .8s cubic-bezier(.22,.61,.36,1) both;}
  .story.in > *:nth-child(2){animation-delay:.08s;} .story.in > *:nth-child(3){animation-delay:.16s;} .story.in > *:nth-child(4){animation-delay:.3s;}
  @keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px);}to{opacity:1;transform:none;filter:none;}}
  .era{font-family:var(--font-mono);font-weight:600;font-size:clamp(.8rem,1.5vw,.94rem);letter-spacing:.14em;
    color:var(--cyan);margin:0 0 10px;}
  .era.atom{color:var(--amber);}
  h1{font-weight:700;font-size:clamp(1.65rem,4.4vw,3.1rem);line-height:1.18;letter-spacing:-.02em;margin:0 0 12px;
    text-wrap:balance;word-break:keep-all;}
  h1 .b{color:var(--cyan);} h1 .a{color:var(--amber);}
  .story.cover .era{color:var(--dim);letter-spacing:.2em;}
  .story.cover h1{font-size:clamp(2.2rem,6.4vw,4.8rem);line-height:1.12;}
  .story.ask h1{font-size:clamp(2rem,5.6vw,4rem);}
  .cap{font-size:clamp(.96rem,1.85vw,1.14rem);line-height:1.7;color:var(--dim);margin:0;max-width:33rem;word-break:keep-all;}
  .cap:empty{display:none;}
  /* 마지막 단계: 변하지 않을 것 → 잠시 뒤 '그래서 우리는' */
  .story.truth .era{font-family:var(--font-body);font-weight:600;font-size:clamp(1.05rem,2vw,1.4rem);letter-spacing:0;color:var(--dim);margin-bottom:8px;}
  .story.truth h1{font-size:clamp(1.75rem,3.9vw,2.8rem);}
  .then{margin:22px 0 0;font-weight:700;font-size:clamp(1.3rem,2.7vw,2rem);line-height:1.3;word-break:keep-all;}
  .then .b{color:var(--cyan);}
  .then:empty{display:none;}
  .story.in > .then{animation-delay:1.5s;}
  .story.in > .next{animation-delay:2.1s;}
  .next{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:12px 22px;border-radius:999px;pointer-events:auto;
    border:1px solid var(--cyan);color:var(--ink);text-decoration:none;font-weight:600;font-size:1rem;background:var(--chip);
    box-shadow:0 0 24px rgba(90,214,230,.25);transition:background .2s;}
  .next[hidden]{display:none;}
  .next:hover{background:var(--chip-h);}
  .next:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:.8rem;color:var(--dim);}
  .legend span{display:inline-flex;align-items:center;gap:8px;}
  .sw{width:14px;height:10px;border:1.5px solid var(--amber);border-bottom-width:0;}
  .bitsw{font-family:var(--font-mono);font-weight:600;color:var(--cyan);font-size:.8rem;letter-spacing:.06em;}

  /* 아톰의 세상 이름표(강·학교·공원…) */
  .labels{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s;}
  .labels.on{opacity:1;}
  .lbl{position:absolute;left:0;top:0;will-change:transform;}
  .lbl::before{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);}
  .lbl::after{content:"";position:absolute;left:0;top:-18px;width:1px;height:15px;background:rgba(243,176,58,.55);}
  .lbl span{position:absolute;left:0;top:-18px;transform:translate(-50%,-100%);padding:3px 11px;border-radius:999px;
    font-size:.84rem;font-weight:600;color:var(--amber);background:rgba(10,10,11,.66);border:1px solid rgba(243,176,58,.42);white-space:nowrap;}

  .tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;pointer-events:auto;flex-shrink:0;max-width:50%;}
  button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--rule);
    border-radius:999px;padding:8px 14px;font-size:.84rem;cursor:pointer;transition:background .2s,border-color .2s,color .2s;}
  button:hover{background:var(--chip-h);}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);}
  button:disabled{opacity:.35;cursor:default;}

  .bottom{position:relative;display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
  .year{position:absolute;right:0;bottom:calc(100% + 6px);text-align:right;pointer-events:none;transition:opacity .6s;}
  .year.hide{opacity:0;}
  .year .num{display:block;font-family:var(--font-mono);font-weight:500;font-size:clamp(3rem,10vw,7.5rem);line-height:.9;
    letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.2px var(--cyan);font-variant-numeric:tabular-nums;
    text-shadow:0 0 28px rgba(90,214,230,.35);}
  .year .num small{font-family:var(--font-body);font-weight:600;font-size:.3em;letter-spacing:0;margin-left:.16em;
    color:var(--cyan);-webkit-text-stroke:0;text-shadow:none;}
  .year .what{display:block;margin-top:8px;font-family:var(--font-mono);font-size:.8rem;letter-spacing:.08em;color:var(--dim);}
  .tlrow{display:flex;align-items:center;gap:10px;}
  .nav{flex-shrink:0;width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:1.15rem;}
  ol.tl{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,1fr);position:relative;}
  ol.tl::before,ol.tl .fill{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:11px;height:2px;background:var(--rule);}
  ol.tl .fill{background:linear-gradient(90deg,var(--amber),var(--cyan) 22%);right:auto;width:0;transition:width 1s cubic-bezier(.22,.61,.36,1);}
  ol.tl li{position:relative;display:flex;justify-content:center;min-width:0;}
  ol.tl button{background:none;border:0;border-radius:10px;padding:2px 4px 4px;display:flex;flex-direction:column;
    align-items:center;gap:6px;min-width:0;width:100%;}
  ol.tl .dot{width:14px;height:14px;margin-top:4px;border-radius:50%;background:var(--bg);border:2px solid var(--faint);
    transition:border-color .4s,background .4s,transform .4s,box-shadow .4s;}
  ol.tl li.past .dot{border-color:var(--cyan);background:var(--cyan);}
  ol.tl li.now .dot{border-color:var(--cyan);background:var(--bg);transform:scale(1.35);box-shadow:0 0 14px var(--cyan);}
  ol.tl li:first-of-type.past .dot,ol.tl li:first-of-type.now .dot{border-color:var(--amber);}
  ol.tl li:first-of-type.past .dot{background:var(--amber);}
  ol.tl li:first-of-type.now .dot{box-shadow:0 0 14px var(--amber);}
  ol.tl .lb{font-size:.86rem;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  ol.tl .yr{font-family:var(--font-mono);font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
  ol.tl li.now .lb{color:var(--ink);} ol.tl li.now .yr{color:var(--cyan);}
  .pbar{height:2px;margin:0 50px;background:var(--veil0);overflow:hidden;border-radius:2px;}
  .pbar i{display:block;height:100%;width:0;background:var(--cyan);opacity:.7;}
  .hint{font-size:.76rem;color:var(--faint);text-align:center;margin:0;}
  kbd{font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--dim);}
  .era:empty{display:none;}
  /* 덱 안에 끼운 경우: 넘기기는 덱이 맡으므로 자동 재생은 숨긴다 */
  .embed #play{display:none;}
  .nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim);}

  @media (max-width:640px){
    ol.tl .yr{display:none;}
    ol.tl .lb{font-size:.72rem;}
    .nav{display:none;}
    ol.tl .lb{letter-spacing:-.02em;}
    .legend,.hint{display:none;}
    .tools{max-width:46%;}
    .tools button{padding:6px 10px;font-size:.74rem;}
    .shade{height:320px;}
    .pbar{margin:0 8px;}
    .lbl span{font-size:.72rem;padding:2px 8px;}
  }
  @media (prefers-reduced-motion:reduce){ ol.tl .fill{transition:none;} .story.in > *{animation:none;} }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="강과 산, 나무와 새, 사람과 학교가 있는 아톰의 세상 위로 비트의 세상이 시대마다 넓어지는 3차원 장면. 왼쪽 오른쪽 방향키로 단계를 넘깁니다."></canvas>

<div class="hud" id="hud">
  <div class="shade" aria-hidden="true"></div>
  <div class="shade b" aria-hidden="true"></div>
  <div class="labels" id="labels" aria-hidden="true"></div>
  <div class="top">
    <div class="story in" id="story" aria-live="polite">
      <p class="era atom" id="era"></p>
      <h1 id="title">아톰의 세상과 비트의 세상</h1>
      <p class="cap" id="cap"></p>
      <p class="then" id="then"></p>
    </div>
    <div class="tools">
      <button id="play" type="button" aria-pressed="false">자동 재생</button>
      <button id="sound" type="button" aria-pressed="false">소리</button>
      <button id="full" type="button">전체 화면</button>
    </div>
  </div>

  <div class="bottom">
    <div class="year hide" id="year" aria-hidden="true"><span class="num"><span id="ynum">1990</span><small id="ysuf">년대</small></span><span class="what" id="ywhat"></span></div>
    <div class="legend">
      <span><i class="sw" aria-hidden="true"></i>아톰의 세상 · 물질과 몸, 그리고 공간</span>
      <span><b class="bitsw" aria-hidden="true">0 1</b>비트의 세상 · 정보와 화면, 그리고 네트워크</span>
    </div>
    <div class="tlrow">
      <button class="nav" id="prev" type="button" aria-label="이전 단계">‹</button>
      <ol class="tl" id="tl"><span class="fill" id="fill" aria-hidden="true"></span></ol>
      <button class="nav" id="next" type="button" aria-label="다음 단계">›</button>
    </div>
    <div class="pbar" aria-hidden="true"><i id="pfill"></i></div>
    <p class="hint">끌어서 돌리기 · 휠로 확대 · <kbd>←</kbd> <kbd>→</kbd> 넘기기 · <kbd>H</kbd> 글자 숨기기 · <kbd>F</kbd> 전체 화면</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
/* ═════════ 단계 ═════════
   키노트 8장의 흐름을 3D 한 장면에 담는다.
   v: 비트의 세상이 얼마나 넓어졌는지(0 아톰 ~ 5 10년 후, 6 데이터), tl: 아래 연대표에서 지금 위치 */
const TL=[{lb:'아톰',yr:'지금'},{lb:'PC',yr:'1990년대'},{lb:'인터넷',yr:'2000년대 초'},{lb:'모바일',yr:'2010년대'},{lb:'AI',yr:'2020년대'},{lb:'10년 후',yr:'2030년대'}];
const STAGES = [
  {v:0, tl:-1, era:'', atom:true, cover:true, year:null,
   title:'<span class="a">아톰</span>의 세상과<br><span class="b">비트</span>의 세상',
   cap:'동작관악 AI에듀테크 선도교사단', cam:{r:50,phi:0.98,ty:0.5,sw:0}, fog:0.0075},
  {v:0, tl:0, era:'아톰의 세상', atom:true, labels:true, year:null,
   title:'우리가 사는 곳',
   cap:'물질과 몸, 그리고 공간. 손으로 만질 수 있는 모든 것.', cam:{r:21,phi:1.16,ty:0.9,sw:1.0}},
  {v:1, tl:1, era:'1990년대 · PC', year:1990, suf:'년대', what:'PC 보급',
   title:'책상 위에 놓인 <span class="b">작은 비트의 세상</span>',
   cap:'개인용 컴퓨터가 집과 학교에 들어옵니다. PC가 놓인 건물마다 작은 비트의 세상이 생깁니다.', cam:{r:22,phi:1.02,ty:1.5,sw:0.9}},
  {v:2, tl:2, era:'2000년대 초 · 인터넷', year:2000, suf:'년대 초', what:'초고속 인터넷',
   title:'서로 이어지는 <span class="b">비트의 세상</span>',
   cap:'흩어져 있던 컴퓨터가 네트워크로 연결되고, 비트의 세상이 도시 위로 넓게 퍼집니다.', cam:{r:33,phi:0.96,ty:2.4,sw:1.0}},
  {v:3, tl:3, era:'2010년대 · 모바일', year:2010, suf:'년대', what:'스마트폰',
   title:'손 안에서 이어지는 <span class="b">비트의 세상</span>',
   cap:'비트가 책상을 떠나 사람과 함께 거리를 움직입니다. 공간 어디에나 비트가 있습니다.', cam:{r:26,phi:1.16,ty:1.2,sw:0.9}},
  {v:4, tl:4, era:'2020년대 · 생성형 AI', year:2020, suf:'년대', what:'생성형 AI',
   title:'<span class="b">비트의 세상</span>이 연,<br>새로운 문제해결의 시대',
   cap:'아톰 세상의 데이터가 AI를 만들고, 비트 세상의 AI는 다시 아톰의 세상을 변화시킵니다.', cam:{r:46,phi:1.0,ty:7,sw:1.1}},
  {v:4, tl:5, era:'2030년대 · 10년 후', ask:true, year:2030, suf:'년대', what:'10년 후',
   title:'<span class="b">10년 후</span>를<br>예측한다면?',
   cap:'', cam:{r:60,phi:1.12,ty:8,sw:0.8}},
  {v:5, tl:5, era:'2030년대 · 10년 후', year:2030, suf:'년대', what:'10년 후',
   title:'<span class="b">비트</span>와 함께 우주까지<br>확장되는 <span class="a">아톰의 세상</span>',
   cap:'비트의 세상은 더 넓어지고, 아톰의 세상과 서로 더 큰 영향을 주고받을 것', cam:{r:80,phi:1.2,ty:15,sw:1.2}},
  {v:6, tl:6, era:'10년 후에도 변하지 않을 것은,', truth:true, year:null,
   title:'비트의 세상은 <span class="b">데이터</span>와 <span class="b">알고리즘</span>으로<br>만들어진다는 것',
   cap:'', then:'오늘, 내일은 <span class="b">데이터</span>와 AI로<br>학교 현장의 여러 문제를<br>어떻게 해결할 수 있을지<br>함께 이야기 나눠볼까요?', cam:{r:40,phi:0.8,ty:0.4,sw:1.0}}
];
const LAST = STAGES.length-1;
// 덱 안에 끼운 경우(?embed=1): 넘기기는 덱(parent.DECK)이 맡고, 덱의 단계가 곧 이 장면의 단계다. 장을 떠나 있으면 그리지 않는다
const EMBED = /[?&]embed=1/.test(location.search) && window.parent!==window;
const HOST = EMBED && window.frameElement ? window.frameElement.closest('.slide') : null;
const D = ()=>EMBED ? window.parent.DECK : null;
if(EMBED) document.documentElement.classList.add('embed');
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const SMALL = Math.min(innerWidth, innerHeight) < 700;
const Q = SMALL ? 0.6 : 1;

/* ═════════ 렌더러 ═════════ */
const canvas = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){

const RIVER=new THREE.CatmullRomCurve3([[-36,8.8],[-22,6.0],[-12,3.0],[-4,5.2],[4,2.6],[11,4.6],[19,2.4],[36,4.4]].map(([x,z])=>new THREE.Vector3(x,0,z)),false,'centripetal');

const rN=rP.map((p,i)=>{ const t=RIVER.getTangentAt(Math.min(1,i/RS)); return new THREE.Vector2(-t.z,t.x).normalize(); });
function riverAt(u,off,out){ const f=clamp01(u)*RS, i=Math.min(RS-1,Math.floor(f)), k=f-i, P=rP[i], Q2=rP[i+1], n=rN[i], m=rN[i+1];
  out[0]=lerp(P.x,Q2.x,k)+lerp(n.x,m.x,k)*off; out[2]=lerp(P.z,Q2.z,k)+lerp(n.y,m.y,k)*off; return out; }
function riverDist(x,z){ let m=1e9; for(let i=0;i<=RS;i+=2){ const p=rP[i], d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z); if(d<m) m=d; } return Math.sqrt(m); }

const riverMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uLen:{value:RLEN},uAmber:{value:AMBER},uBg:{value:BG}},
  vertexShader:'varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader:`uniform float uTime; uniform float uLen; uniform vec3 uAmber; uniform vec3 uBg; varying vec2 vUv; varying vec3 vW;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float across=abs(vUv.y-0.5)*2.0, s=vUv.x*uLen;
      vec3 c=mix(vec3(0.03,0.07,0.11),vec3(0.07,0.12,0.15),smoothstep(0.35,1.0,across));
      float w1=pow(0.5+0.5*sin(s*2.1-uTime*0.9+sin(vUv.y*8.0+s*0.6)*1.4),14.0);
      float w2=pow(0.5+0.5*sin(s*5.1-uTime*1.7+vUv.y*21.0),24.0);
      vec2 q=vec2((s-uTime*0.6)*2.6,vUv.y*6.0), g=floor(q), f=fract(q)-0.5;
      float sp=step(0.9,h(g))*smoothstep(0.28,0.0,length(f*vec2(1.0,2.2)))*(0.55+0.45*sin(uTime*3.0+h(g+1.7)*6.28));
      vec3 col=c+vec3(0.5,0.58,0.62)*(w1*0.5+w2*0.32)*(1.0-across*0.55)+uAmber*sp*0.75;
      gl_FragColor=vec4(mix(uBg,col,smoothstep(28.0,15.0,length(vW.xz))),1.0); }`
});
{ const v=[],uv=[],idx=[];

function freeSpot(x,z,rad){
  if(riverDist(x,z)<RW+1.5+rad) return false;
  if(Math.hypot(x-PARK.x,z-PARK.z)<PARK.r+0.35+rad) return false;
  if(x>FIELD.x-2.4-rad&&x<FIELD.x+2.4+rad&&z>-8.7-rad&&z<-3.5+rad) return false;
  if(x>8.4-rad&&x<13.4+rad&&z>-3.9-rad&&z<-0.6+rad) return false;
  if(towers.some(t=>Math.hypot(t.x-x,t.z-z)<0.5+rad)) return false;
  return true; }
for(let tries=0,n=0;n<62&&tries<9000;tries++){

  const w=0.6+rand()*0.55, d=0.6+rand()*0.55;

  if(buildings.some(b=>Math.abs(b.x-x)<(b.w+w)/2+0.35&&Math.abs(b.z-z)<(b.d+d)/2+0.35)) continue;

const points=new THREE.Points(geo,ptsMat); points.frustumCulled=false; scene.add(points);

/* ═════════ 단계별 값(v 기준) ═════════ */
const DOME=[[0.01,0.45],[0.01,0.45],[11,0.45],[14.5,0.62],[17.5,0.95],[44,0.9],[18,0.45]];
const FOG=[0.014,0.014,0.013,0.012,0.0095,0.0052,0.0105];
const DOME_A=[0,0,1,1,1.15,1.1,0], DOME_W=[0,0,0.13,0.14,0.15,0.09,0.035];
const WIN_CYAN=[0,0,0,0.04,0.2,0.3,0.4];   // PC 건물 말고도 시안으로 물드는 창문 비율(2030년대에도 아톰의 금빛이 남는다)
const BLOOM=[0.55,0.85,1.0,1.0,1.1,1.2,1.0];
// 세로 화면에서는 도시가 잘리지 않게 더 멀리서 본다
const camFor=s=>{ const c=STAGES[s].cam, k=camera.aspect<1?Math.min(1.9,1/Math.pow(camera.aspect,0.75)):1; return {r:c.r*k,phi:c.phi,ty:c.ty}; };
let stage=0, stageTime=0, tween=null;
const A={isle:0,arc:0,dr:0.01,dh:0.45,dw:0,node:0,net:0,beam:0,tower:0,ring:0,fog:0.014,ai:1,bloom:0.55,scale:150,grid:0,mesh:0,fut:0,space:0};

function goTo(s,opts){
  opts=opts||{};
  s=Math.max(0,Math.min(LAST,s));
  if(s===stage&&!opts.force) return;
  const prev=stage; stage=s; stageTime=0; renderHud(prev); chime(s);
  const offv=camera.position.clone().sub(controls.target), sph=new THREE.Spherical().setFromVector3(offv);
  const dur=reduce?0.001:(opts.dur||2.5);
  tween={t:0,e:0,dur,from:{r:sph.radius,phi:sph.phi,ty:controls.target.y},to:camFor(s),sw:(s>prev?1:-1)*STAGES[s].cam.sw,kick:reduce?0:1};
  if(playTimer) playStart=performance.now();
}

function toStage(s){ const d=D(); if(d){ s=Math.max(0,Math.min(LAST,s)); d.go(d.cur().slide,s,true); } else goTo(s); }
window.BW={go:s=>goTo(s)};

/* ═════════ 화면 글자 ═════════ */
const $=id=>document.getElementById(id);
const tl=$('tl'), story=$('story');
TL.forEach((t,i)=>{ const li=document.createElement('li');
  li.innerHTML=`<button type="button" aria-label="${t.lb} ${t.yr}"><span class="dot"></span><span class="lb">${t.lb}</span><span class="yr">${t.yr}</span></button>`;
  li.querySelector('button').onclick=()=>{ stopPlay(); toStage(STAGES.findIndex(s=>s.tl===i)); }; tl.appendChild(li); });
let yearShown=null, yearAnim=null;
function renderHud(prev){
  const st=STAGES[stage];
  story.classList.remove('in'); void story.offsetWidth;
  story.classList.toggle('cover',!!st.cover); story.classList.toggle('ask',!!st.ask); story.classList.toggle('truth',!!st.truth);
  $('era').textContent=st.era; $('era').classList.toggle('atom',!!st.atom);
  $('title').innerHTML=st.title; $('cap').textContent=st.cap; $('then').innerHTML=st.then||'';
  story.classList.add('in');
  $('labels').classList.toggle('on',!!st.labels);
  [...tl.querySelectorAll('li')].forEach((li,i)=>{ li.classList.toggle('past',i<st.tl); li.classList.toggle('now',i===st.tl);
    li.querySelector('button').setAttribute('aria-current',i===st.tl?'step':'false'); });
  $('fill').style.width=`calc((100% - 100%/6) * ${clamp01(st.tl/5)})`;
  $('prev').disabled=stage===0; $('next').disabled=stage===LAST;
  // 연도 카운터
  const y=$('year');
  if(st.year==null){ y.classList.add('hide'); }
  else { y.classList.remove('hide'); $('ywhat').textContent=st.what; $('ysuf').textContent=st.suf||'';
    const from=(yearShown==null)?st.year-12:yearShown, to=st.year, t0=performance.now(), d=reduce?1:1100;
    cancelAnimationFrame(yearAnim);
    const step=now=>{ const k=clamp01((now-t0)/d), e=1-Math.pow(1-k,3); $('ynum').textContent=Math.round(lerp(from,to,e)); if(k<1) yearAnim=requestAnimationFrame(step); };
    yearAnim=requestAnimationFrame(step); yearShown=to; }
}
$('prev').onclick=()=>{ stopPlay(); toStage(stage-1); };
$('next').onclick=()=>{ stopPlay(); toStage(stage+1); };

/* 자동 재생 */
const PLAY_MS=8000; let playTimer=null, playStart=0;
function stopPlay(){ if(playTimer){ clearInterval(playTimer); playTimer=null; $('play').textContent='자동 재생'; $('play').setAttribute('aria-pressed','false'); $('pfill').style.width='0'; } }
$('play').onclick=()=>{
  if(playTimer){ stopPlay(); return; }
  if(stage===LAST) goTo(0);
  $('play').textContent='멈춤'; $('play').setAttribute('aria-pressed','true'); playStart=performance.now();
  playTimer=setInterval(()=>{ const k=(performance.now()-playStart)/PLAY_MS; $('pfill').style.width=(clamp01(k)*100)+'%';
    if(k>=1){ if(stage>=LAST){ stopPlay(); return; } goTo(stage+1); } },100);
};
$('full').onclick=()=>{ if(EMBED){ window.parent.document.dispatchEvent(new KeyboardEvent('keydown',{key:'f'})); return; } try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
const hud=$('hud');
window.addEventListener('keydown',e=>{
  if(EMBED){ const k=e.key;
    if(['ArrowRight','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); D()&&D().next(); }
    else if(['ArrowLeft','PageUp','Backspace'].includes(k)){ e.preventDefault(); D()&&D().prev(); }
    else if(k==='h'||k==='H'){ hud.classList.toggle('off'); }
    else if(/^[nNoOfFㅜㅐㄹ]$/.test(k)||['Home','End','Escape'].includes(k)){ window.parent.document.dispatchEvent(new KeyboardEvent('keydown',{key:k})); }
    return; }
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); stopPlay(); if(stage===LAST) return; goTo(stage+1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); stopPlay(); goTo(stage-1); }
  else if(e.key==='Home'){ stopPlay(); goTo(0); }
  else if(e.key==='End'){ stopPlay(); goTo(LAST); }
  else if(/^[0-8]$/.test(e.key)){ stopPlay(); goTo(+e.key); }
  else if(e.key==='f'||e.key==='F'){ $('full').click(); }
  else if(e.key==='h'||e.key==='H'){ hud.classList.toggle('off'); }
});

/* 소리(선택): 낮은 울림 위에 단계마다 맑은 음 */
let ac=null, pad=null, soundOn=false;
const SCALE=[220,261.63,293.66,329.63,392,440,523.25];
const PAD_F=[110,110,123.47,130.81,146.83,164.81,146.83];
function startSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    if(!pad){ const g=ac.createGain(); g.gain.value=0; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
      const o1=ac.createOscillator(), o2=ac.createOscillator(); o1.type='sine'; o2.type='triangle';
      o1.frequency.value=110; o2.frequency.value=110*1.498; o2.detune.value=6;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination); o1.start(); o2.start(); pad={g,f,o1,o2}; }
    pad.g.gain.setTargetAtTime(0.035,ac.currentTime,0.8); soundOn=true; padFor(stage);
  }catch(e){ soundOn=false; }
}
function stopSound(){ if(pad&&ac) pad.g.gain.setTargetAtTime(0,ac.currentTime,0.4); soundOn=false; }
function padFor(s){ if(!pad||!ac) return; const v=STAGES[s].v; pad.f.frequency.setTargetAtTime(420+v*180,ac.currentTime,1.2);
  pad.o1.frequency.setTargetAtTime(PAD_F[v],ac.currentTime,1.5); pad.o2.frequency.setTargetAtTime(PAD_F[v]*1.498,ac.currentTime,1.5); }
let noiseBuf=null;
function whoosh(){ try{
  if(!noiseBuf){ noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.9),ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const src=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(), t=ac.currentTime; src.buffer=noiseBuf; f.type='bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(320,t); f.frequency.exponentialRampToValueAtTime(1900,t+0.38); f.frequency.exponentialRampToValueAtTime(520,t+0.85);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.055,t+0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+0.88);
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+0.9); }catch(e){} }
function chime(s){ if(!soundOn||!ac) return; padFor(s); whoosh();
  [0,1].forEach(k=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=SCALE[(s+k*2)%SCALE.length]*2;
    const t=ac.currentTime+k*0.12; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.05,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.7); }); }
$('sound').onclick=()=>{ if(soundOn){ stopSound(); $('sound').setAttribute('aria-pressed','false'); } else { startSound(); $('sound').setAttribute('aria-pressed',soundOn?'true':'false'); } };

/* ═════════ 크기와 품질 ═════════ */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setPixelRatio(DPR); renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if(composer){ composer.setPixelRatio(DPR); composer.setSize(w,h); bloom.resolution.set(w*DPR*0.5,h*DPR*0.5); }
  ptsMat.uniforms.uPix.value=DPR; winMat.uniforms.uPix.value=DPR; }
addEventListener('resize',resize); resize();
let perfAcc=0, perfN=0, perfChecks=0;
function adapt(dt){ if(perfChecks>3) return; perfAcc+=dt; perfN++;
  if(perfAcc>2.5){ const avg=perfAcc/perfN; perfAcc=0; perfN=0; perfChecks++;
    if(avg>0.03){ if(DPR>1){ DPR=Math.max(1,DPR-0.5); resize(); } else if(composer){ composer=null; } } } }

/* ═════════ 매 프레임 ═════════ */
const tmp=[0,0,0], tmp2=[0,0,0];
let last=performance.now(), clock=0;
function frame(now){
  if(HOST&&!HOST.classList.contains('cur')){ last=now; requestAnimationFrame(frame); return; }
  const dt=Math.min(0.05,(now-last)/1000); last=now; clock+=dt*(reduce?0.35:1); stageTime+=dt;
  const ease=1-Math.exp(-dt*2.4), v=STAGES[stage].v;
  adapt(dt);

  // 아톰의 세상
  moveLife(clock); moveBirds(clock); moveCars(clock);
  riverMat.uniforms.uTime.value=clock;
  winMat.uniforms.uTime.value=clock;
  for(let i=0;i<WN;i++){ const tgt=(v>=1&&pcSet.has(win.bld[i]))?1:(win.pick[i]<WIN_CYAN[v]?1:0);
    winTone[i]+= (tgt-winTone[i])*Math.min(1,dt*(0.8+win.pick[i]*1.2)); }
  winG.attributes.aTone.needsUpdate=true;

  // 비트의 세상 구조물
  A.isle=lerp(A.isle,v===1?0.42:0,ease); isleMat.opacity=A.isle;
  A.arc=lerp(A.arc,v===6?0.08:(v>=5?0.26:(v>=2?0.4:0)),ease); arcMat.opacity=A.arc;
  A.dr=lerp(A.dr,DOME[v][0],ease*0.8); A.dh=lerp(A.dh,DOME[v][1],ease*0.8); A.dw=lerp(A.dw,DOME_W[v],ease);
  domeMat.opacity=A.dw; domeWire.scale.set(A.dr,A.dr*A.dh,A.dr);
  ripples.forEach((rp,k)=>{ const u=frac(clock*0.12+k*0.5), on=(v>=3&&v<6)?1:0; const sc=A.dr*(1+u*0.9);
    rp.o.scale.set(sc,sc*A.dh,sc); rp.m.opacity=on*A.dw*0.9*(1-u)*Math.min(1,u*6); });
  A.tower=lerp(A.tower,v>=3?(v===6?0.3:0.6):0,ease); towerMat.opacity=A.tower;
  A.ring=lerp(A.ring,v>=3?(v===6?0.35:1):0,ease);
  rings.forEach(r=>{ const u=frac(clock*0.35+r.ph), sc=0.3+u*(v===5?11:6.5); r.o.scale.set(sc,1,sc); r.m.opacity=A.ring*0.55*(1-u)*Math.min(1,u*8); });
  A.ai=lerp(A.ai,v===5?1.65:1,ease*0.7); aiScale=A.ai; aiGroup.scale.setScalar(aiScale); aiGroup.rotation.y+=dt*(v>=4?0.04:0);
  A.node=lerp(A.node,v>=4?(v===6?0.3:0.95):0,ease); nodeMat.opacity=A.node;
  A.net=lerp(A.net,v>=4?(v===6?0.28:1):0,ease); netMat.uniforms.uOp.value=A.net; netMat.uniforms.uTime.value=clock;
  A.beam=lerp(A.beam,(v===4||v===5)?1:0,ease); beamMat.opacity=A.beam*(0.2+0.14*Math.sin(clock*2.2));
  { const bp=beamG.attributes.position.array; beams.forEach((b,k)=>{ nodeWorld(b.node,tmp);
      bp.set([b.bottom.x,b.bottom.y,b.bottom.z,tmp[0],tmp[1],tmp[2]],k*6); }); beamG.attributes.position.needsUpdate=true; }
  // 2030년대: 옥상끼리 잇는 망, 아톰의 발전, 우주까지 이어지는 위성
  A.mesh=lerp(A.mesh,v===5?0.55:(v===6?0.12:0),ease); meshMat.uniforms.uOp.value=A.mesh; meshMat.uniforms.uTime.value=clock;
  A.fut=lerp(A.fut,v===5?1:0,ease*0.7); winMat.uniforms.uLitAll.value=A.fut; moveFuture(clock,v,dt);
  A.space=lerp(A.space,v===5?1:0,ease*0.6); moveSpace(clock);
  A.fog=lerp(A.fog,STAGES[stage].fog||FOG[v],ease); scene.fog.density=A.fog; ptsMat.uniforms.uFog.value=A.fog; winMat.uniforms.uFog.value=A.fog;
  A.scale=lerp(A.scale,v===6?205:150,ease); ptsMat.uniforms.uScale.value=A.scale;
  A.grid=lerp(A.grid,v===6?0.2:0,ease); dataGridMat.opacity=A.grid;
  if(bloom){ A.bloom=lerp(A.bloom,BLOOM[v],ease); bloom.strength=A.bloom; }
  if(grainPass) grainPass.uniforms.uTime.value=clock;

  // 비트 입자
  const dR=A.dr, dH=A.dh, settled=stageTime>2.4;
  for(let i=0;i<N;i++){
    const r=role[i]; let x,y,z,a=0,moving=false; const j=i*3;
    if(v===6){ if(gridX[i]>900){ x=pos[j]; y=pos[j+1]; z=pos[j+2]; }
      else { x=gridX[i]; y=0.12; z=gridZ[i]; const d=Math.hypot(x,z), w=0.5+0.5*Math.sin(d*0.85-clock*2.0); a=0.38+0.62*w*w; } }
    else if(r===R.PC){ const b=buildings[pcB[ref[i]]];
      if(v>=1){ x=b.x+off[j]*0.5; y=b.h*0.55+Math.abs(off[j+1])*0.55; z=b.z+off[j+2]*0.5; a=v>=5?0.6:1; }
      else { x=b.x; y=b.h*0.5; z=b.z; } }
    else if(r===R.NET){ const u=frac(u0[i]+clock*spd[i]); arcAt(ref[i],v>=2?u:0,tmp);
      x=tmp[0]+off[j]*0.04; y=tmp[1]+off[j+1]*0.04; z=tmp[2]+off[j+2]*0.04; a=v>=2?Math.sin(Math.PI*u):0; moving=v>=2; }
    else if(r===R.DOME){ if(v>=2){ x=dir[j]*dR; y=dir[j+1]*dR*dH; z=dir[j+2]*dR; a=DOME_A[v]*(0.55+0.45*Math.sin(clock*1.3+ph[i])); }
      else { const p=pcTop[ref[i]]; x=p.x; y=p.y; z=p.z; } }
    else if(r===R.PHONE){ const p=people[ref[i]], rr=u0[i], an=clock*spd[i]+ph[i];
      if(v>=3){ x=p.x+Math.cos(an)*rr; y=0.62+Math.abs(off[j+1])*0.22+Math.sin(an*0.7)*0.05; z=p.z+Math.sin(an)*rr; a=1; moving=true; }
      else { x=p.x; y=0.3; z=p.z; } }
    else if(r===R.AI){ nodeWorld(ref[i],tmp);
      if(v>=4){ const k=0.4*aiScale; x=tmp[0]+off[j]*k; y=tmp[1]+off[j+1]*k*0.55; z=tmp[2]+off[j+2]*k; a=0.72+0.28*Math.sin(clock*2+ph[i]); }
      else { x=tmp[0]*0.25; y=0.8; z=tmp[2]*0.25; } }
    else { const b=beams[ref[i]]; nodeWorld(b.node,tmp2);
      const up=tone[i]>0.5, u=frac(u0[i]+(up?1:-1)*clock*spd[i]*1.7);
      if(v>=4){ x=lerp(b.bottom.x,tmp2[0],u)+Math.sin(u*9+ph[i])*0.08; y=lerp(b.bottom.y,tmp2[1],u); z=lerp(b.bottom.z,tmp2[2],u); a=Math.sin(Math.PI*u); moving=true; }
      else { x=b.bottom.x; y=b.bottom.y; z=b.bottom.z; } }
    const ta=v===6?a:a*BASE_A[r];
    if(moving&&settled){ pos[j]=x; pos[j+1]=y; pos[j+2]=z; alpha[i]+=(ta-alpha[i])*0.35; }
    else { pos[j]+=(x-pos[j])*ease; pos[j+1]+=(y-pos[j+1])*ease; pos[j+2]+=(z-pos[j+2])*ease; alpha[i]+=(ta-alpha[i])*ease; }
  }
  for(let k=0;k<(reduce?4:32);k++){ const i=(Math.random()*N)|0; glyph[i]=1-glyph[i]; }
  geo.attributes.position.needsUpdate=true; geo.attributes.aAlpha.needsUpdate=true; geo.attributes.aGlyph.needsUpdate=true;

  // 카메라
  if(tween){ tween.t=Math.min(1,tween.t+dt/tween.dur); const t=tween.t, e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, de=e-tween.e, bump=Math.sin(Math.PI*e)*(tween.kick||0); tween.e=e;
    const offv=camera.position.clone().sub(controls.target), sph=new THREE.Spherical().setFromVector3(offv);
    sph.radius=lerp(tween.from.r,tween.to.r,e)*(1+0.12*bump); sph.phi=lerp(tween.from.phi,tween.to.phi,e)+0.06*bump; sph.theta+=tween.sw*de;
    controls.target.y=lerp(tween.from.ty,tween.to.ty,e);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    camera.fov=45+5*bump; camera.updateProjectionMatrix();
    if(t>=1){ tween=null; camera.fov=45; camera.updateProjectionMatrix(); } }
  controls.update();
  if(STAGES[stage].labels) moveLabels();
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* 시작: 멀리서 도시로 내려온다 */
const mh=/^#s([0-8])$/.exec(location.hash||'');
stage=HOST&&HOST.dataset.k?Math.min(LAST,+HOST.dataset.k):(mh?+mh[1]:0); renderHud(stage);
{ const offv=camera.position.clone().sub(controls.target), sph=new THREE.Spherical().setFromVector3(offv);
  tween={t:0,e:0,dur:reduce?0.001:4.2,from:{r:sph.radius,phi:sph.phi,ty:controls.target.y},to:camFor(stage),sw:0.9}; }
if(!EMBED) canvas.focus({preventScroll:true});
// 끼운 경우 끌지 않고 누르기만 하면 덱의 다음 단계로
if(EMBED){ let px=0,py=0; canvas.addEventListener('pointerdown',e=>{ px=e.clientX; py=e.clientY; });
  canvas.addEventListener('click',e=>{ if(Math.hypot(e.clientX-px,e.clientY-py)<6) D()&&D().next(); }); }
requestAnimationFrame(frame);
})();

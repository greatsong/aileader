<body>

<script>
// ───────────────────────── core: math, colour, ink & cel drawing ─────────────────────────

const CEL = { lw: 3, amp: 1.1, line: 'rgb(46,36,34)', seed: 1 };

// ───────────────────────── gouache background painter ─────────────────────────
